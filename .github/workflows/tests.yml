name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m fka verify
      - run: python -m fkb verify
      # The cross-check that neither algorithm can make on its own: both
      # against each other and against the oracle, on every instance.
      - run: python -m fkb compare --all

  sage:
    name: SageMath 10.9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Checkout runs on the host because the Sage image has neither a
      # compatible Actions Node runtime nor Git. Mount the checked-out tree and
      # keep install, tests, and verification in one container invocation.
      - name: Test with SageMath 10.9
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            -v "${GITHUB_WORKSPACE}:/work" \
            -w /work \
            ghcr.io/sagemath/sage-binder-env:10.9 \
            -lc '/sage/sage -python -m pip install --user -e ".[dev]" &&
                 /sage/sage -python -m pytest &&
                 /sage/sage -python -m fka verify &&
                 /sage/sage -python -m fkb verify'
