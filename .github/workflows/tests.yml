name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m fka verify

  sage:
    name: SageMath 10.9
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sagemath/sage-binder-env:10.9
    steps:
      # The Sage image's libc cannot run the Node runtime bundled with
      # actions/checkout. Fetch the exact workflow ref using Git instead.
      - name: Checkout without Node
        run: |
          git init .
          git remote add origin "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"
          git fetch --no-tags --depth=1 origin "${GITHUB_REF}"
          git checkout --detach FETCH_HEAD
      - run: /sage/sage -python -m pip install --user -e ".[dev]"
      - run: /sage/sage -python -m pytest
      - run: /sage/sage -python -m fka verify
